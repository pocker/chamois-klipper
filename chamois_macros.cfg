# Chamois MMU macros
#
# Include this file from printer.cfg:  [include chamois_macros.cfg]
# Tune the variables here, or at runtime with e.g.
#   SET_GCODE_VARIABLE MACRO=CHAMOIS_FORM_TIP VARIABLE=cooling_moves VALUE=6
#
# The geometry follows the PrusaSlicer / OrcaSlicer "single extruder multi material"
# settings, so you can copy values from a working slicer profile:
#   cooling_tube_position = "Cooling tube position"  (nozzle tip -> centre of cooling zone)
#   cooling_tube_length   = "Cooling tube length"
#   parking_position      = "Filament parking position" (nozzle tip -> final tip position)

[gcode_macro CHAMOIS_FORM_TIP]
description: Shape the filament tip so the MMU can pull it out cleanly
# Ramming: push some plastic out quickly to build pressure and fill the nozzle (0 = off)
variable_ramming_length: 0           # mm of filament
variable_ramming_speed: 10           # mm/s
# Optional temperature drop during tip forming (0 = keep the current temperature)
variable_toolchange_temp: 0
# Nozzle separation: first 15mm retract fast to tear the filament off the melt
variable_unloading_speed_start: 80   # mm/s
# Rest of the retraction to the top of the cooling zone, slowing down
variable_unloading_speed: 18         # mm/s
variable_cooling_tube_position: 35   # mm, nozzle tip -> centre of the cooling zone
variable_cooling_tube_length: 10     # mm
# Cooling moves: dip the tip up and down in the cooling zone so it solidifies
variable_cooling_moves: 4
variable_initial_cooling_speed: 10   # mm/s
variable_final_cooling_speed: 50     # mm/s
variable_melt_zone_pause: 0          # ms, wait after ramming
variable_cooling_zone_pause: 0       # ms, wait after the cooling moves
# Final tip position measured from the nozzle tip (0 = stay at the top of the cooling zone)
variable_parking_position: 0         # mm
gcode:
    {% set extruder = printer.toolhead.extruder %}
    {% set original_temp = printer[extruder].target %}
    {% set top_of_cooling = cooling_tube_position + cooling_tube_length / 2 %}
    {% set slow_retract = top_of_cooling - 15 %}

    SAVE_GCODE_STATE NAME=_chamois_form_tip
    M83

    {% if toolchange_temp > 0 %}
        M104 S{toolchange_temp}
    {% endif %}

    # 1. Ramming
    {% if ramming_length > 0 %}
        {% for i in range(4) %}
            G1 E{ramming_length / 4} F{ramming_speed * (0.6 + 0.2 * i) * 60}
        {% endfor %}
    {% endif %}
    {% if melt_zone_pause > 0 %}
        G4 P{melt_zone_pause}
    {% endif %}

    # 2. Nozzle separation and retraction to the top of the cooling zone
    G1 E-15 F{unloading_speed_start * 60}
    {% if slow_retract > 0 %}
        G1 E-{0.7 * slow_retract} F{unloading_speed * 60}
        G1 E-{0.2 * slow_retract} F{0.5 * unloading_speed * 60}
        G1 E-{0.1 * slow_retract} F{0.3 * unloading_speed * 60}
    {% endif %}

    # 3. Cooling moves inside the cooling zone, always ending with an upward move
    {% if cooling_moves > 0 and cooling_tube_length > 0 %}
        {% set speed_inc = (final_cooling_speed - initial_cooling_speed) / (2 * cooling_moves - 1) %}
        {% for i in range(cooling_moves) %}
            {% set speed = initial_cooling_speed + speed_inc * 2 * i %}
            G1 E{cooling_tube_length} F{speed * 60}
            G1 E-{cooling_tube_length} F{(speed + speed_inc) * 60}
        {% endfor %}
    {% endif %}
    {% if cooling_zone_pause > 0 %}
        G4 P{cooling_zone_pause}
    {% endif %}

    # 4. Park the tip
    {% if parking_position > top_of_cooling %}
        G1 E-{parking_position - top_of_cooling} F{unloading_speed * 60}
    {% endif %}

    {% if toolchange_temp > 0 %}
        M104 S{original_temp}
    {% endif %}
    RESTORE_GCODE_STATE NAME=_chamois_form_tip
